[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aigator"
version = "0.1.0"
description = "Local-first multi-platform AI session aggregator & context search engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Tibor Sekera" }
]
keywords = [
    "ai",
    "chatgpt",
    "claude",
    "gemini",
    "perplexity",
    "copilot",
    "mcp",
    "search",
    "sqlite",
    "fts5",
    "local-first",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[project.urls]
Homepage = "https://github.com/tiborsekera/aigator"
Repository = "https://github.com/tiborsekera/aigator"
Issues = "https://github.com/tiborsekera/aigator/issues"

[project.scripts]
aigator = "aigator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aigator*"]

[tool.pylint.main]
init-hook = "import sys; sys.path.extend(['.', '..'])"

